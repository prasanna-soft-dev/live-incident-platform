spring.application.name=auth-service

server.port=8081
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/


spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==================================
# JWT
# ==================================

jwt.issuer=http://localhost:8081
jwt.audience=live-incident-platform
jwt.access-token-expiration=900
jwt.key-id=auth-key-001

jwt.private-key-path=keys/private.pem
jwt.public-key-path=keys/public.pem

